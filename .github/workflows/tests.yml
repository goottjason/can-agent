name: Tests

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Backend tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon --continue

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            build/reports/tests
            build/test-results
          retention-days: 7

  sidecar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sidecar/lottery/requirements.txt

      - name: Sidecar tests
        working-directory: sidecar/lottery
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
          python -m pytest test_buy.py -q
