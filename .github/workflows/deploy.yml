name: Deploy can-agent

# ⚠️ 현재 "수동 실행(workflow_dispatch)"만 활성. main push 자동배포는 비활성.
# 이유: main = 미국 대전환 코드이나 실서버 준비 미완(환전·prod toss.broker.enabled·
#       DB 마이그레이션·유니버스 적재·승인). 준비 완료 전 자동배포 시 실계좌 매매가 깨진다.
#
# 미국 실서버 준비 완료 후 아래 `push:` 블록 주석을 해제하면 sbshop처럼
# main push = 서버 SSH → git pull + docker compose up --build 자동배포가 된다.
#
# 1회 설정: 저장소 Settings → Secrets and variables → Actions →
#   CANAGENT_DEPLOY_KEY = ssh-key-2026-06-25.key 파일의 전체 내용(개인키)
# 서버 전제(2026-07-14 분리): ~/projects/can-agent 가 origin/main pull 가능한 git 체크아웃 +
#   자기 docker-compose.yml + .env 보유. postgres·nginx 는 ~/projects/infra 공유 인프라.

on:
  workflow_dispatch: {}   # 수동 실행 (Actions 탭 → Run workflow)
  # push:
  #   branches: [main]

concurrency:
  group: deploy-canagent-main
  cancel-in-progress: false   # 배포 중복 방지(진행 중이면 대기)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy (can-agent 자기 compose만)
        env:
          SSH_KEY: ${{ secrets.CANAGENT_DEPLOY_KEY }}
          SERVER: 168.107.31.154
          USER_NAME: ubuntu
        run: |
          if [ -z "$SSH_KEY" ]; then
            echo "::error::CANAGENT_DEPLOY_KEY 시크릿이 없습니다. 저장소 Actions 시크릿에 개인키를 등록하세요."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "$USER_NAME@$SERVER" bash -se <<'REMOTE'
            set -euo pipefail
            cd ~/projects/can-agent
            git pull origin main
            docker compose up -d --build
            # 컨테이너 재생성 후 nginx가 옛 IP를 캐시하므로 reload 필수
            docker exec projects-nginx-1 nginx -s reload
          REMOTE

      - name: Healthcheck
        env:
          SERVER: 168.107.31.154
        run: |
          code=000
          for i in $(seq 1 30); do
            sleep 5
            code=$(curl -s -o /dev/null -w '%{http_code}' -L -k --connect-timeout 5 "https://$SERVER/can-agent" || echo 000)
            { [ "$code" = "200" ] || [ "$code" = "302" ]; } && break
            echo "waiting... (HTTP $code, $i/30)"
          done
          echo "HTTP $code"
          if [ "$code" != "200" ] && [ "$code" != "302" ]; then
            echo "::error::배포 헬스체크 실패 (HTTP $code)"
            exit 1
          fi
          echo "✅ can-agent 배포 성공 (HTTP $code)"
