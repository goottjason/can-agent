spring:
  application:
    name: can-agent

  datasource:
    url: jdbc:h2:mem:canagent
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  thymeleaf:
    cache: false

server:
  port: 8080

# 외부 API 설정
api:
  dart:
    key: ${DART_API_KEY:}
  krx:
    key: ${KRX_API_KEY:}
  korea-investment:
    app-key: ${KOREA_INVESTMENT_APP_KEY:}
    app-secret: ${KOREA_INVESTMENT_APP_SECRET:}
    account-number: ${KOREA_INVESTMENT_ACCOUNT_NUMBER:}
    is-real: ${KOREA_INVESTMENT_IS_REAL:false}

# SEC EDGAR (P4: 미국 재무 데이터). User-Agent 필수(SEC 정책) — 운영에선 실제 연락처로 override 권장.
edgar:
  user-agent: "${EDGAR_USER_AGENT:CAN-Agent/1.0 (admin@canagent.local)}"
  base-url: "${EDGAR_BASE_URL:https://data.sec.gov}"
  min-interval-ms: 125

# 토스증권 Open API (P5: 미국 시세/캔들, P6: 주문 공용). 한투/DART/KRX 키는 유지(P9).
# token-url·캔들 필드명은 PoC 미확정 — 실호출로 확정 시 값만 교체.
toss:
  app-key: "${TOSS_APP_KEY:}"
  app-secret: "${TOSS_APP_SECRET:}"
  base-url: "${TOSS_BASE_URL:https://openapi.tossinvest.com}"
  token-url: "${TOSS_TOKEN_URL:}"        # 비우면 base-url + token-path 조합

# 자동매매 스케줄
trading:
  scheduler:
    enabled: true
    # 모든 크론 zone = America/New_York (ET). 미국 대전환(P7).
    cron: "0 0 7 * * MON-FRI"              # 평일 오전 7시 ET (야간 점수 산출 — EDGAR 나이틀리 이후·개장 전)
    sync-cron: "0 0 4 * * MON-FRI"         # 평일 오전 4시 ET (주가·재무 동기화 — SEC 나이틀리 ZIP 재컴파일 이후)
    quarterly-cron: "0 0 10 1 1,4,7,10 *"  # 분기 시작월(1·4·7·10) 1일 오전 10시 ET (재무제표 동기화)
    monitor-cron: "0 */5 9-15 * * MON-FRI" # 장중 5분마다 실시간 모니터링 (ET 정규장 09:30~16:00, 개장 게이트가 09:00~09:29 필터)
  max-positions: 10              # 최대 보유 종목 수
  position-rate: 10              # 종목당 최대 배분 비율 (%)
  stop-loss-rate: 7              # 손절 기준 (%)
  take-profit-rate: 20           # 익절 기준 (%)
  min-score: 120                 # 매수 최소 점수 (CANSLIM + 컵앤핸들, 최대 190)
  real-trading: false            # 실제 매매 실행 여부 (true: 실전, false: 시뮬레이션)
  secret: ${TRADE_SECRET:}       # trade/run 엔드포인트 인증 키 (비어있으면 인증 해제)

# 알림 설정
notification:
  enabled: true
  telegram:
    enabled: false
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  kakao:
    enabled: false
    webhook-url: ${KAKAO_WEBHOOK_URL:}
  console:
    enabled: true                # 콘솔 로그 알림 (항상 권장)
