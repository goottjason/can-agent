<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAN Agent - 자동매매 대시보드</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>CAN Agent</h1>
            <p class="subtitle">CANSLIM + 컵앤핸들 자동매매 시스템</p>
        </header>

        <section class="summary">
            <div class="summary-card">
                <h3>투자 금액</h3>
                <p class="value" th:text="${#numbers.formatInteger(totalInvestment, 1, 'COMMA')} + '원'">0원</p>
            </div>
            <div class="summary-card">
                <h3>현재 평가액</h3>
                <p class="value" th:text="${#numbers.formatInteger(totalCurrentValue, 1, 'COMMA')} + '원'">0원</p>
            </div>
            <div class="summary-card" th:classappend="${totalProfit.doubleValue() >= 0} ? 'profit' : 'loss'">
                <h3>평가손익</h3>
                <p class="value" th:text="${#numbers.formatInteger(totalProfit, 1, 'COMMA')} + '원'">0원</p>
            </div>
            <div class="summary-card" th:classappend="${totalProfitRate.doubleValue() >= 0} ? 'profit' : 'loss'">
                <h3>수익률</h3>
                <p class="value" th:text="${#numbers.formatDecimal(totalProfitRate, 1, 2)} + '%'">0%</p>
            </div>
        </section>

        <section class="stats">
            <div class="stat-item">
                <span class="label">보유 종목</span>
                <span class="value" th:text="${portfolioCount} + '종목'">0종목</span>
            </div>
            <div class="stat-item">
                <span class="label">매수 횟수</span>
                <span class="value" th:text="${buyCount} + '건'">0건</span>
            </div>
            <div class="stat-item">
                <span class="label">매도 횟수</span>
                <span class="value" th:text="${sellCount} + '건'">0건</span>
            </div>
            <form th:action="@{/trade/run}" method="post" class="manual-check">
                <button type="submit">수동 검사 실행</button>
            </form>
        </section>

        <div class="content-grid">
            <section class="portfolio">
                <h2>포트폴리오</h2>
                <div th:if="${#lists.isEmpty(portfolios)}" class="empty-state">
                    보유 종목이 없습니다.
                </div>
                <table th:unless="${#lists.isEmpty(portfolios)}">
                    <thead>
                        <tr>
                            <th>종목</th>
                            <th>수량</th>
                            <th>매수가</th>
                            <th>현재가</th>
                            <th>수익률</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p : ${portfolios}">
                            <td>
                                <span class="stock-name" th:text="${p.stock.name}">종목명</span>
                                <span class="stock-code" th:text="'(' + ${p.stock.code} + ')'">(000000)</span>
                            </td>
                            <td th:text="${p.quantity} + '주'">0주</td>
                            <td th:text="${#numbers.formatInteger(p.averageBuyPrice, 1, 'COMMA')} + '원'">0원</td>
                            <td th:text="${#numbers.formatInteger(p.currentPrice, 1, 'COMMA')} + '원'">0원</td>
                            <td th:classappend="${p.profitRate.doubleValue() >= 0} ? 'profit' : 'loss'"
                                th:text="${#numbers.formatDecimal(p.profitRate, 1, 2)} + '%'">0%</td>
                        </tr>
                    </tbody>
                </table>
            </section>

            <section class="trades">
                <h2>최근 매매 기록</h2>
                <div th:if="${#lists.isEmpty(recentTrades)}" class="empty-state">
                    매매 기록이 없습니다.
                </div>
                <table th:unless="${#lists.isEmpty(recentTrades)}">
                    <thead>
                        <tr>
                            <th>날짜</th>
                            <th>종목</th>
                            <th>구분</th>
                            <th>수량</th>
                            <th>가격</th>
                            <th>사유</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="t : ${recentTrades}">
                            <td th:text="${#temporals.format(t.tradeDateTime, 'MM/dd HH:mm')}">01/01 00:00</td>
                            <td>
                                <span class="stock-name" th:text="${t.stock.name}">종목명</span>
                            </td>
                            <td th:classappend="${t.tradeType.name() == 'BUY'} ? 'buy' : 'sell'"
                                th:text="${t.tradeType.name() == 'BUY'} ? '매수' : '매도'">매수</td>
                            <td th:text="${t.quantity} + '주'">0주</td>
                            <td th:text="${#numbers.formatInteger(t.price, 1, 'COMMA')} + '원'">0원</td>
                            <td class="reason" th:text="${t.reason}">사유</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </div>

        <footer>
            <p>CAN Agent v0.1.0 - William O'Neil 전략 기반 자동매매 시스템</p>
        </footer>
    </div>
</body>
</html>
