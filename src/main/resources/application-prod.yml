spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:canagent}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  thymeleaf:
    cache: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /can-agent

# 외부 API 설정
api:
  dart:
    key: ${DART_API_KEY}
  krx:
    key: ${KRX_API_KEY}
  korea-investment:
    app-key: ${KOREA_INVESTMENT_APP_KEY}
    app-secret: ${KOREA_INVESTMENT_APP_SECRET}
    account-number: ${KOREA_INVESTMENT_ACCOUNT_NUMBER}
    is-real: ${KOREA_INVESTMENT_IS_REAL:true}

# 자동매매 스케줄
trading:
  scheduler:
    enabled: true
    # 모든 크론 zone = America/New_York (ET). 미국 대전환(P7).
    cron: "0 0 7 * * MON-FRI"              # 오전 7시 ET (야간 점수 산출)
    sync-cron: "0 0 4 * * MON-FRI"         # 오전 4시 ET (주가·재무 동기화 — SEC 나이틀리 이후)
    quarterly-cron: "0 0 10 1 1,4,7,10 *"  # 분기 시작월 1일 오전 10시 ET (재무제표 동기화)
    monitor-cron: "0 */5 9-15 * * MON-FRI" # 장중 5분마다 (ET 정규장 09:30~16:00)
  max-positions: 10
  position-rate: 10
  stop-loss-rate: 7
  take-profit-rate: 20
  min-score: 120
  real-trading: ${REAL_TRADING:true}
  secret: ${TRADE_SECRET:}

# 알림 설정
notification:
  enabled: true
  telegram:
    enabled: true
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
  kakao:
    enabled: true
    webhook-url: ${KAKAO_WEBHOOK_URL:}
  console:
    enabled: false
